.lfga-site:not(.lfga-scrolled) .lfga-header-cta{color:#fff;border-color:rgba(255,255,255,.3)}
.lfga-site .lfga-hero h1{color:#fff}
.lfga-site .lfga-hero h1 em{color:#9ca8ec}
.lfga-site .lfga-hero .lfga-eyebrow{color:#c1c7de}
.lfga-site .lfga-hero .lfga-eyebrow>span{background:#9da8ee;box-shadow:0 0 0 4px #aab2ef1b}
.lfga-site .lfga-hero-copy>p{color:#c3c8dd}

.lfga-site .lfga-hero-note{color:#aab0cf}
.lfga-site .lfga-hero .lfga-note-check{background:rgba(255,255,255,.12);color:#9ca8ec}
.lfga-site .lfga-hero .lfga-button-primary{background:#fff;color:var(--blue)!important}
.lfga-site .lfga-hero .lfga-button-primary:hover{background:#e7eaff}
.lfga-site .lfga-proof-strip,.lfga-site .lfga-section,.lfga-site .lfga-process,.lfga-site .lfga-footer{background-image:radial-gradient(rgba(43,58,140,.1) 1px,transparent 1px);background-size:22px 22px}

.lfga-site .lfga-contact{background-image:radial-gradient(60% 80% at 92% 8%,rgba(122,133,191,.22),transparent 60%),radial-gradient(40% 60% at 0% 100%,rgba(43,58,140,.3),transparent 70%)}
@media(prefers-reduced-motion:reduce){.lfga-site::before{animation:none}}

/* ---- v5: navbar fixa que some ao descer e volta ao subir ---- */
.lfga-site{padding-top:var(--lfga-hh,84px)}
.lfga-site .lfga-header{position:fixed;top:0;left:0;right:0;margin:0;z-index:30;transition:transform .35s ease,background-color .3s,border-color .3s,box-shadow .3s;will-change:transform}
.lfga-site.lfga-hide .lfga-header{transform:translateY(-110%);box-shadow:none}
.lfga-site .lfga-header:focus-within{transform:none}
.lfga-site.lfga-scrolled .lfga-header{box-shadow:0 8px 30px rgba(10,12,30,.1)}

.lfga-site .lfga-header .lfga-header-cta:hover{background:#fff;border-color:#fff;color:var(--blue)!important}
