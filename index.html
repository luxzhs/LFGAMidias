.lfga-site.lfga-scrolled .lfga-header{box-shadow:0 8px 30px rgba(10,12,30,.1)}

/* ---- v6: navbar com as mesmas cores do topo (azul-noite com brilhos) ---- */
.lfga-site.lfga-scrolled .lfga-header{background-color:#0a0c18;background-image:radial-gradient(420px 220px at 78% 0%,rgba(43,58,140,.75),transparent 70%),radial-gradient(360px 200px at 10% 100%,rgba(122,133,191,.35),transparent 70%),linear-gradient(180deg,#07080f,#0d1020);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom-color:rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(5,7,18,.35)}
.lfga-site .lfga-header .lfga-brand{color:#fff}
.lfga-site .lfga-header .lfga-brand small{color:#aab0cf}
.lfga-site .lfga-header .lfga-nav{color:#cfd3ea}
.lfga-site .lfga-header .lfga-nav a:hover{color:#fff}
.lfga-site .lfga-header .lfga-header-cta{color:#fff;border-color:rgba(255,255,255,.3)}
.lfga-site .lfga-header .lfga-header-cta:hover{background:#fff;border-color:#fff;color:var(--blue)!important}

/* ---- v7: em celular/tablet em p\xE9 o notebook s\xF3 aparece depois do texto inicial; em telas largas fica ao lado ---- */
@media(max-width:850px),(max-width:1099px) and (max-aspect-ratio:9/10){.lfga-site .lfga-hero{grid-template-columns:1fr}.lfga-site .lfga-hero-slot{display:none}}

/* ---- v8: setas (SVG no celular/tablet) + portf\xF3lio com estudo de caso ---- */
.lfga-site .lfga-arrow-svg{display:none;vertical-align:-.14em;transition:transform .2s}
@media(max-width:1099px),(hover:none) and (pointer:coarse){.lfga-site .lfga-arrow-glyph{display:none!important}.lfga-site .lfga-arrow-svg{display:inline-block}}
.lfga-site .lfga-button:hover .lfga-arrow-svg,.lfga-site .lfga-header-cta:hover .lfga-arrow-svg,.lfga-site .lfga-text-link:hover .lfga-arrow-svg{transform:translate(2px,-2px)}
.lfga-site .lfga-case{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:44px;align-items:center;padding:34px;background:#f4f5f9;border-radius:8px}
.lfga-site .lfga-case-shot{position:relative;width:100%;max-width:340px;margin:0 auto;border-radius:18px;background:#fff;box-shadow:0 30px 60px #2b3a8c22,0 0 0 1px #e1e3ec;overflow:hidden}
.lfga-site .lfga-case-bar{height:26px;background:#eef0f6;display:flex;gap:5px;align-items:center;padding:0 12px}
.lfga-site .lfga-case-bar i{width:7px;height:7px;border-radius:50%;background:#c3c7d6}
.lfga-site .lfga-case-scroll{height:460px;overflow:hidden;position:relative}
.lfga-site .lfga-case-scroll img{display:block;width:100%;height:auto;transform:translateY(0);transition:transform 1.2s ease}
@media(hover:hover){.lfga-site .lfga-case-shot:hover .lfga-case-scroll img{transform:translateY(calc(-100% + 460px));transition:transform 11s linear}}
@media(hover:none){.lfga-site .lfga-case.lfga-in .lfga-case-scroll img{animation:lfgaShot 18s ease-in-out infinite alternate}}
@keyframes lfgaShot{0%,8%{transform:translateY(0)}92%,100%{transform:translateY(calc(-100% + 460px))}}
@media(prefers-reduced-motion:reduce){.lfga-site .lfga-case-scroll{overflow-y:auto}.lfga-site .lfga-case-scroll img{animation:none!important;transition:none!important;transform:none!important}}
.lfga-site .lfga-case-meta{font:700 11px Manrope,'DM Sans',sans-serif;letter-spacing:.14em;color:#565c6a}
.lfga-site .lfga-case-meta span{color:var(--blue);margin-right:8px}
.lfga-site .lfga-case-body h3{font:700 clamp(24px,2.6vw,34px)/1.12 Manrope,'DM Sans',sans-serif;letter-spacing:-.03em;margin:14px 0}
.lfga-site .lfga-case-body>p{font-size:15px;line-height:1.75;color:#4f5562;max-width:520px;margin:0 0 20px}
.lfga-site .lfga-case-facts{margin:0 0 20px;border-top:1px solid #dcdfe8}
.lfga-site .lfga-case-facts>div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid #dcdfe8}
.lfga-site .lfga-case-facts dt{font:700 11px Manrope,'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6b7180;padding-top:3px}
.lfga-site .lfga-case-facts dd{margin:0;font-size:15px;line-height:1.55;color:#14161d}
.lfga-site .lfga-case-quote{background:#fff;border-left:3px solid var(--blue);padding:14px 18px;border-radius:4px}
.lfga-site .lfga-case-quote b{font:700 11px Manrope,'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.lfga-site .lfga-case-quote p{margin:6px 0 0;font-size:15px;line-height:1.6;color:#2a2e3a}
.lfga-site .lfga-case-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:48px}
.lfga-site .lfga-case-steps article{border-top:2px solid #14161d;padding-top:16px}
.lfga-site .lfga-case-steps span{font:700 12px Manrope,'DM Sans',sans-serif;color:var(--blue)}
.lfga-site .lfga-case-steps h4{font:700 18px Manrope,'DM Sans',sans-serif;letter-spacing:-.02em;margin:8px 0 6px}
.lfga-site .lfga-case-steps p{margin:0;font-size:14px;line-height:1.65;color:#4f5562}
.lfga-site .lfga-case-cta{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:48px;padding:28px 32px;background:#151722;border-radius:8px;color:#fff}
.lfga-site .lfga-case-cta h4{margin:0;font:700 22px Manrope,'DM Sans',sans-serif;letter-spacing:-.02em}
.lfga-site .lfga-case-cta p{margin:6px 0 0;font-size:15px;color:#c3c6d2}
.lfga-site .lfga-case-cta .lfga-button-primary{background:#fff;color:var(--blue)!important;white-space:nowrap}
@media(max-width:900px){.lfga-site .lfga-case{grid-template-columns:1fr;padding:22px;gap:28px}.lfga-site .lfga-case-steps{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.lfga-site .lfga-case-steps{grid-template-columns:1fr}.lfga-site .lfga-case-cta{flex-direction:column;align-items:flex-start;padding:24px}.lfga-site .lfga-case-facts>div{grid-template-columns:1fr;gap:4px}}

/* ---- v9: assinatura do depoimento ---- */
.lfga-site .lfga-case-cite{display:block;margin-top:10px;font:600 12px Manrope,'DM Sans',sans-serif;color:#6b7180}
